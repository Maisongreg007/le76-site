<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pain équipe">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icone-180.png?v=1">
<link rel="icon" type="image/png" href="../icone-192.png?v=1">
<title>Pain · Équipe</title>
<link rel="stylesheet" href="../style.css?v=2">
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>

<section id="login" class="wrap login" hidden>
  <form class="login-card" id="loginForm">
    <img src="../icone-180.png?v=1" alt="" style="width:84px;height:84px;border-radius:19px;box-shadow:0 6px 20px rgba(0,0,0,.18)">
    <h1 style="font-size:26px;margin-top:14px">Espace équipe</h1>
    <p class="mute" id="loginHelp">Précommandes de pain du camping</p>
    <input id="code" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" maxlength="8" placeholder="Code" required>
    <input id="code2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="Confirmer le code" hidden>
    <button class="btn-main" type="submit" id="loginBtn">Entrer</button>
    <p class="error" id="loginErr"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="bar">
    <div class="bar-in">
      <span class="brand">🥐 Pain · équipe</span>
      <nav class="tabs" id="tabs">
        <button data-v="day" class="on">Aujourd’hui</button>
        <button data-v="orders">Commandes</button>
        <button data-v="products">Produits</button>
        <button data-v="stats">Chiffres</button>
        <button data-v="settings">Réglages</button>
        <button data-v="log">Journal</button>
      </nav>
    </div>
  </header>
  <main class="wrap wide" id="view"></main>
</div>

<div id="sheetBack" class="sheet-back" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-head"><button class="link" id="sheetClose">Fermer</button><h2 id="sheetTitle"></h2><span style="width:56px"></span></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script src="../qr.js?v=1"></script>
<script src="equipe.js?v=5"></script>
</body>
</html>
