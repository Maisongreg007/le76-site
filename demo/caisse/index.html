<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caisse 76">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icone-180.png?v=2">
<link rel="icon" type="image/png" href="icone-192.png?v=2">
<meta name="robots" content="noindex, nofollow">
<title>Démo · ComptaCaisse · Le 76</title>
<link rel="stylesheet" href="caisse.css?v=2.0.0">
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 14px;background:#5a4fcf;color:#fff;font:600 13px/1.3 -apple-system,BlinkMacSystemFont,sans-serif"><span>Démo · ComptaCaisse · données fictives (Le 76 et Camping)</span><span style="display:flex;gap:6px"><a href="/demo/" style="color:#fff;background:rgba(255,255,255,.18);border-radius:99px;padding:4px 11px;text-decoration:none">Accueil démo</a><a href="api.php?action=demo-reset" style="color:#fff;background:rgba(255,255,255,.18);border-radius:99px;padding:4px 11px;text-decoration:none">Réinitialiser</a></span></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Connexion -->
<section id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <img class="app-icon" src="icone-180.png?v=2" alt="">
    <h1>ComptaCaisse</h1>
    <p class="sub">Le 76 et Camping</p>
    <div class="group">
      <label class="row"><span>Identifiant</span><input name="name" autocomplete="username" required autocapitalize="none"></label>
      <label class="row"><span>Mot de passe</span><input name="password" type="password" autocomplete="current-password" required></label>
    </div>
    <p class="error" id="loginError" role="alert"></p>
    <button class="btn-main" type="submit">Se connecter</button>
  </form>
</section>

<!-- Application -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <div class="seg" id="registerSeg" role="tablist" aria-label="Caisse"></div>
      <nav class="tabs" id="tabs" aria-label="Sections">
        <button data-view="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></button>
        <button data-view="journal"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Journal</span></button>
        <button data-view="months"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Mois</span></button>
        <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Réglages</span></button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="view-home" class="view"></section>
    <section id="view-journal" class="view" hidden></section>
    <section id="view-months" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>
</div>

<!-- Feuille de saisie (fenêtre) -->
<div id="sheetBack" class="sheet-back" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-head">
    <button class="link" type="button" id="sheetClose">Fermer</button>
    <h2 id="sheetTitle"></h2>
    <span class="sheet-spacer"></span>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script src="caisse.js?v=2.0.0"></script>
</body>
</html>
