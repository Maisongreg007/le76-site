<style>
/* Concept : un registre de cuisine. Bandeau date + prénom, onglets collants, cartes empilées comme des étiquettes de frigo. */
:root{
  --bg:#EEF2F2; --surface:#FFFFFF; --surface-2:#E2EAEA; --ink:#12262A; --ink-2:#4A6064; --line:#CBD7D8;
  --accent:#0B6B78; --accent-ink:#FFFFFF;
  --ok:#1B7A47; --ok-bg:#DDF1E5; --bad:#B3261E; --bad-bg:#FAE0DD; --warn:#80540A; --warn-bg:#FBEFD2;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B1E; --surface:#172629; --surface-2:#1F3236; --ink:#E6F0F0; --ink-2:#9DB5B8; --line:#2C4348;
    --accent:#4FC1CF; --accent-ink:#06222A;
    --ok:#5FD08B; --ok-bg:#17382A; --bad:#FF8E85; --bad-bg:#43201D; --warn:#F0C36B; --warn-bg:#3F3216;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B1E; --surface:#172629; --surface-2:#1F3236; --ink:#E6F0F0; --ink-2:#9DB5B8; --line:#2C4348;
  --accent:#4FC1CF; --accent-ink:#06222A;
  --ok:#5FD08B; --ok-bg:#17382A; --bad:#FF8E85; --bad-bg:#43201D; --warn:#F0C36B; --warn-bg:#3F3216;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font-body);
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1000px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:20px 12px}
.brand{min-width:0}
.eyebrow{font:600 13px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
h1{font:700 40px/1 var(--font-display);letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.today{margin:6px 0 0;color:var(--ink-2)}
.who{display:flex;flex-direction:column;gap:4px;min-width:180px;flex:0 1 220px}
.who label,.f>label,.f>.lb{font:600 12px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.who input{height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line)}
nav.tabs button{flex:0 0 auto;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  font:600 18px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;position:relative}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs .dot{display:inline-block;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--bad);color:var(--surface);font:600 12px/20px var(--font-body);letter-spacing:0;vertical-align:2px}

#view{padding-block:16px;display:flex;flex-direction:column;gap:28px}
section.blk{display:flex;flex-direction:column;gap:12px;min-width:0}
.blk-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
h2{font:700 26px/1.1 var(--font-display);letter-spacing:.03em;text-transform:uppercase;margin:0}
h3{font:600 20px/1.15 var(--font-display);letter-spacing:.02em;margin:0}
.sub{color:var(--ink-2);margin:0;font-size:14px}
.zone{font:600 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:6px 0 0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;text-align:left}
button.stat{cursor:pointer;font:inherit}
.stat b{display:block;font:500 28px/1.1 var(--font-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.stat.is-bad{background:var(--bad-bg);border-color:var(--bad)}
.stat.is-bad b{color:var(--bad)}
.stat.is-warn{background:var(--warn-bg);border-color:var(--warn)}
.stat.is-warn b{color:var(--warn)}
.stat.is-done b{color:var(--ok)}

.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:600 17px/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.eq{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eq.is-bad{background:var(--bad-bg);border-color:var(--bad)}
.eq.is-warn{background:var(--warn-bg);border-color:var(--warn)}
.eq header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.range{font:500 13px/1 var(--font-mono);color:var(--ink-2);white-space:nowrap}
.field{display:flex;align-items:center;gap:8px}
.temp{flex:1;min-width:0;height:56px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:500 28px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.unit{font:500 20px/1 var(--font-mono);color:var(--ink-2)}
.pm{width:48px;height:56px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font:600 22px/1 var(--font-body);cursor:pointer}
.hint{margin:0;min-height:20px;font-size:14px;font-weight:600}
.hint.ok{color:var(--ok)} .hint.bad{color:var(--bad)}
.corr{display:flex;flex-direction:column;gap:4px}
.corr label{font-size:13px;color:var(--ink-2)}
input.in,select.in,textarea.in,.corr input,.set input,.set select,.addf input,.addf select{height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;width:100%}
textarea.in{height:auto;min-height:72px;padding:10px;resize:vertical}
.rec{display:flex;align-items:center;justify-content:space-between;gap:8px}
.val{font:500 32px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.val small{font-size:18px;color:var(--ink-2);margin-left:4px}
.meta{margin:0;color:var(--ink-2);font-size:14px}
.act{margin:0;font-size:14px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font:600 13px/1 var(--font-body);white-space:nowrap;vertical-align:middle}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.mute{background:var(--surface-2);color:var(--ink-2)}
.eq.is-bad .pill.bad{background:var(--surface)}

.form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 16px/1 var(--font-body);cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{height:40px;background:transparent;align-self:flex-start}
.btn.sm{height:40px;padding:0 12px;font-size:15px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.sure{background:var(--bad);color:var(--surface)}
.btn[disabled],input[disabled],select[disabled]{opacity:.55;cursor:not-allowed}

.tasks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.task{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.box{flex:0 0 28px;width:28px;height:28px;border-radius:7px;border:2px solid var(--ink-2);display:grid;place-items:center;color:transparent}
.task[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok)}
.task[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tx{display:flex;flex-direction:column;min-width:0}
.nm{font-weight:500}
.mt{font-size:13px;color:var(--ink-2)}
.task[disabled]{cursor:not-allowed}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font:600 12px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
td.c{font:500 14px/1 var(--font-mono)}
td.c.full{background:var(--ok-bg);color:var(--ok)}
td.c.part{background:var(--warn-bg);color:var(--warn)}
td.c.bad{background:var(--bad-bg);color:var(--bad)}
td.c.none{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.hist li.bad{background:var(--bad-bg);border-color:var(--bad)}
.hist li.warn{background:var(--warn-bg);border-color:var(--warn)}
.hist .val2{font:500 16px/1 var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hist .by{grid-column:1 / -1;font-size:13px;color:var(--ink-2)}
.hist .ttl{min-width:0}
.hist .side{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dayh{font:600 16px/1.2 var(--font-display);letter-spacing:.04em;text-transform:uppercase;margin:10px 0 0}

.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--surface-2);cursor:zoom-in;padding:0;display:block}
.thumbbtn{padding:0;border:0;background:none;cursor:zoom-in}
.photo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photo img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.preset{min-height:84px;padding:12px 14px;text-align:left;background:var(--surface);border:2px solid var(--accent);border-radius:12px;display:flex;flex-direction:column;justify-content:center;gap:4px;cursor:pointer;color:var(--ink)}
.preset b{font:600 21px/1.15 var(--font-display);letter-spacing:.02em}
.preset span{font-size:13px;color:var(--ink-2)}
.preset:active{background:var(--accent);color:var(--accent-ink)}
.preset:active span{color:var(--accent-ink)}
.preset.add{border-style:dashed;border-color:var(--ink-2);background:transparent}
.preset.add b{color:var(--ink-2)}
.preset.edit{border-color:var(--warn);background:var(--warn-bg)}
.preset[disabled]{opacity:.55;cursor:not-allowed}
.label-prev{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.label-prev img{width:100%;max-width:450px;border:1px solid var(--line);border-radius:6px;background:#fff}

.set{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,.7fr) minmax(0,.7fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.set.t{grid-template-columns:minmax(0,3fr) minmax(0,1.2fr) minmax(0,1.2fr) auto}
.set.s{grid-template-columns:minmax(0,1fr) auto}
.set .acts{display:flex;gap:6px}
.set .btn{height:44px;padding:0 12px}
.addf{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,.7fr) minmax(0,.7fr) auto;gap:8px;align-items:center;padding:10px;border:1px dashed var(--ink-2);border-radius:10px}
.addf.t{grid-template-columns:minmax(0,3fr) minmax(0,1.2fr) minmax(0,1.2fr) auto}
.addf.s{grid-template-columns:minmax(0,1fr) auto}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
@media (max-width:640px){
  .set,.set.t,.addf,.addf.t{grid-template-columns:1fr 1fr}
  .set>:first-child,.addf>:first-child{grid-column:1 / -1}
  .set .acts{grid-column:1 / -1}
  .set.s .acts{grid-column:auto}
  .set.s,.addf.s{grid-template-columns:minmax(0,1fr) auto}
  .set.s>:first-child,.addf.s>:first-child{grid-column:auto}
  h1{font-size:34px}
  .hist li{grid-template-columns:minmax(0,1fr)}
  .hist .side,.hist .val2{justify-content:flex-start;text-align:left}
}
.empty,.note{padding:16px;border:1px dashed var(--ink-2);border-radius:10px;color:var(--ink-2);margin:0}
.note{border-style:solid;border-color:var(--line);background:var(--surface)}
.chk{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500}
.chk[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:500;z-index:20}
#lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
header.top.in{padding-block:10px;border-bottom:1px solid var(--line);align-items:center}
header.top.in h1{font-size:30px}
header.top.in .today{display:none}
header.top.in .who{flex-basis:180px}
header.top.in .who label{display:none}
.back{display:inline-flex;align-items:center;gap:6px;height:56px;padding:0 20px 0 12px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font:700 22px/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{min-width:0;min-height:160px;padding:18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;color:var(--ink);font:inherit}
.tile svg{color:var(--accent);margin-bottom:auto}
.tile b{font:700 24px/1.05 var(--font-display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.tile span{font-size:16px;color:var(--ink-2);font-weight:500}
.tile.todo{border-color:var(--accent)}
.tile.todo span{color:var(--accent);font-weight:600}
.tile.done{border-color:var(--ok);background:var(--ok-bg)}
.tile.done span,.tile.done svg{color:var(--ok)}
.tile.bad{border-color:var(--bad);background:var(--bad-bg)}
.tile.bad span,.tile.bad svg{color:var(--bad);font-weight:600}
.tile:active{transform:scale(.98)}
.more{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.more .btn{height:44px;font-weight:500;color:var(--ink-2)}
.step{margin:0;font-size:17px;font-weight:500;color:var(--ink)}
.btn.big{height:60px;font-size:19px;width:100%}
@media (max-width:480px){.tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.tile{min-height:130px;padding:14px}.tile b{font-size:19px}.tile span{font-size:14px}}
@media (prefers-reduced-motion:no-preference){ .task,.btn,.stat{transition:background-color .12s,border-color .12s} }
</style>

<div class="wrap">
  <header class="top" id="top">
    <button class="back" id="back" type="button" hidden><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Accueil</button>
    <div class="brand">
      <p class="eyebrow" id="eyebrow">Le 76 · Beinheim</p>

</div>

<div id="login" hidden>
  <div class="lg-box">
    <p class="eyebrow">Le 76 · Beinheim</p>
    <h1>Registre hygiène</h1>
    <p class="lg-msg" id="lg-msg">Entre le code d'accès</p>
    <div class="lg-dots" id="lg-dots" aria-live="polite"></div>
    <div class="lg-pad" id="lg-pad">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" data-k="del" aria-label="Effacer">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" class="ok">OK</button>

<script>
/* DÉMO : même interface que le vrai registre, mais les données restent dans ce navigateur (rien n'est envoyé au serveur). */
(function(){
  var KEY='demo-hygiene-v1';
  function err(code,msg){var e=new Error(msg||code);e.code=code;return e}
  function nouvelId(){var s='',a='abcdefghijklmnopqrstuvwxyz0123456789',r=crypto.getRandomValues(new Uint8Array(20));for(var i=0;i<20;i++)s+=a[r[i]%36];return s}
  function p2(n){return String(n).padStart(2,'0')}
  function dkey(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
  function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  function rnd(a,b){return Math.round((a+Math.random()*(b-a))*10)/10}

  function seed(){
    var c={equipment:{},tasks:{},suppliers:{},fryers:{},presets:{},readings:{},done:{},receptions:{},labels:{},oils:{},cooling:{},documents:{},config:{}};
    var eq=[['Frigo cuisine','frigo',0,4],['Frigo pâtisserie','frigo',0,4],['Chambre froide','chambre',0,4],['Congélateur 1','congelo',-30,-18],['Frigo bar','frigo',0,6]];
    eq.forEach(function(e,i){c.equipment['eq'+i]={name:e[0],kind:e[1],min:e[2],max:e[3],order:i}});
    var tk=[['Plans de travail','daily','Cuisine'],['Sols cuisine','daily','Cuisine'],['Poignées et interrupteurs','daily','Général'],['Sanitaires','daily','Sanitaires'],['Hotte et filtres','weekly','Cuisine'],['Intérieur des frigos','weekly','Cuisine'],['Réserve sèche','monthly','Réserve'],['Détartrage lave-vaisselle','monthly','Cuisine']];
    tk.forEach(function(t,i){c.tasks['tk'+i]={name:t[0],freq:t[1],zone:t[2],order:i}});
    ['Metro','Boucherie Klein','Primeur Vogel','Transgourmet'].forEach(function(n,i){c.suppliers['su'+i]={name:n,order:i}});
    ['Friteuse 1','Friteuse 2'].forEach(function(n,i){c.fryers['fr'+i]={name:n,order:i}});
    var pr=[['Fond brun','prepa',3,null,'Sauces et fonds'],['Sauce tartare','prepa',2,null,'Sauces et fonds'],['Crème brûlée','prepa',2,6,'Desserts'],['Tarte flambée (pâte)','prepa',2,null,'Plats'],['Lardons ouverts','ouvert',3,null,'Viandes'],['Saumon portionné','congele',90,4,'Poissons'],['Spätzle maison','prepa',3,null,'Garnitures']];
    pr.forEach(function(p,i){c.presets['pr'+i]={name:p[0],type:p[1],days:p[2],portions:p[3],category:p[4],order:i}});
    var who=['Julien','Sophie','Camille'],now=Date.now();
    for(var d=13;d>=0;d--){
      var day=new Date(now-d*86400000),dk=dkey(day),dow=day.getDay();
      if(dow===1)continue; // fermé le lundi
      ['matin','soir'].forEach(function(slot,si){
        if(d===0&&slot==='soir'&&new Date().getHours()<17)return;
        if(d===0&&slot==='matin'&&new Date().getHours()<9)return;
        eq.forEach(function(e,i){
          var bad=(d===5&&i===2&&slot==='soir');
          var v=bad?6.4:(e[1]==='congelo'?rnd(-22,-19):rnd(e[2]+0.6,e[3]-0.4));
          var ts=new Date(day.getFullYear(),day.getMonth(),day.getDate(),slot==='matin'?9:18,10+i*2).getTime();
          c.readings[dk+'_'+slot+'_eq'+i]={equipId:'eq'+i,equipName:e[0],kind:e[1],value:v,min:e[2],max:e[3],ok:!bad,action:bad?'Porte mal fermée, réglée. Contrôle à 20h : 3,2 °C':'',who:who[(d+si)%3],ts:ts,dateKey:dk,slot:slot};
        });
      });
      tk.forEach(function(t,i){
        if(t[1]!=='daily')return;
        if(d===0&&i>1)return;
        var pk='d-'+dk;c.done[pk+'_tk'+i]={taskId:'tk'+i,taskName:t[0],freq:'daily',zone:t[2],periodKey:pk,who:who[(d+i)%3],ts:new Date(day.getFullYear(),day.getMonth(),day.getDate(),22,5+i).getTime()};
      });
    }
    var wk='w-'+dkey(monday(new Date()));c.done[wk+'_tk4']={taskId:'tk4',taskName:'Hotte et filtres',freq:'weekly',zone:'Cuisine',periodKey:wk,who:'Julien',ts:now-86400000};
    var rec=[['Metro','su0','Crème, beurre, œufs','frais',true,''],['Boucherie Klein','su1','Bavette, joues de bœuf','frais',true,''],['Primeur Vogel','su2','Légumes, herbes','frais',true,''],['Transgourmet','su3','Frites surgelées','surgele',false,'Carton abîmé, accepté avec réserve']];
    rec.forEach(function(r,i){c.receptions['rc'+i]={supplier:r[0],supplierId:r[1],products:r[2],type:r[3],temp:null,tempOk:r[4],emb:r[4],dlcOk:true,lot:'L'+(4410+i),dlc:dkey(new Date(now+86400000*(5+i))),photo:'',ok:r[4],decision:r[4]?'accepte':'reserve',comment:r[5],who:'Julien',ts:now-86400000*(i+1)}});
    var lab=[['Fond brun','prepa',2,-1],['Sauce tartare','prepa',1,0],['Crème brûlée','prepa',0,1,6,3],['Lardons ouverts','ouvert',1,2],['Saumon portionné','congele',10,80,4,4]];
    lab.forEach(function(l,i){var base=now-86400000*l[2];c.labels['lb'+i]={product:l[0],type:l[1],base:base,dlcKey:dkey(new Date(now+86400000*l[3])),origDlc:'',lot:'',portions:l[4]||null,left:l[5]||l[4]||null,who:'Julien',ts:base,status:'actif'}});
    c.oils.ol0={fryerId:'fr0',fryerName:'Friteuse 1',polar:14,aspect:'ok',action:'',ok:true,who:'Julien',ts:now-86400000*2};
    c.oils.ol1={fryerId:'fr1',fryerName:'Friteuse 2',polar:27,aspect:'fonce',action:'Huile changée',ok:false,who:'Julien',ts:now-86400000*6};
    c.cooling.co0={product:'Joues de bœuf confites',tStart:68,start:now-86400000,ts:now-86400000,status:'termine',tEnd:8,end:now-86400000+95*60000,ok:true,action:'',who:'Julien',endBy:'Julien'};
    c.config.main={};
    return c;
  }
  var data;
  try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){data=null}
  if(!data||!data.equipment)data=seed();
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
  save();
  window.__demoReset=function(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
  window.__demoFiles={};

  var ecouteurs=[];
  function clone(o){return o==null?o:JSON.parse(JSON.stringify(o))}
  function prevenir(c){ecouteurs.forEach(function(l){if(!c||l.c===c)l.f()})}
  function snap(c,id){var d=(data[c]||{})[id];return {id:id,exists:!!d,data:function(){return d?clone(d):undefined},metadata:{fromCache:false,hasPendingWrites:false}}}
  function fusion(a,b){Object.keys(b).forEach(function(k){var v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))fusion(a[k],v);else a[k]=v});return a}
  function ecrire(c,f){f();save();prevenir(c);return Promise.resolve()}
  function docRef(c,id){
    return {id:id,path:c+'/'+id,
      get:function(){return Promise.resolve(snap(c,id))},
      set:function(d){return ecrire(c,function(){(data[c]=data[c]||{})[id]=clone(d)})},
      update:function(d){if(!(data[c]||{})[id])return Promise.reject(err('invalid_argument','Document introuvable'));return ecrire(c,function(){data[c][id]=fusion(clone(data[c][id]),clone(d))})},
      delete:function(){return ecrire(c,function(){if(data[c])delete data[c][id]})},
      onSnapshot:function(next){var l={c:c,f:function(){next(snap(c,id))}};ecouteurs.push(l);setTimeout(l.f,0);return function(){ecouteurs=ecouteurs.filter(function(x){return x!==l})}}
    };
  }
  function requete(c,ordre,lim){
    function docs(){var o=data[c]||{},ids=Object.keys(o);
      if(ordre){var f=ordre[0],s=ordre[1]==='desc'?-1:1;ids.sort(function(a,b){var x=o[a][f],y=o[b][f];if(x===y)return 0;if(x==null)return 1;if(y==null)return -1;return x<y?-s:s})}else ids.sort();
      if(lim)ids=ids.slice(0,lim);
      var d=ids.map(function(id){return snap(c,id)});
      return {docs:d,size:d.length,empty:!d.length,docChanges:function(){return []},metadata:{fromCache:false,hasPendingWrites:false}}}
    return {
      where:function(){throw err('invalid_argument','where non pris en charge')},
      orderBy:function(f,dir){return requete(c,[f,dir||'asc'],lim)},
      limit:function(n){return requete(c,ordre,n)},
      get:function(){return Promise.resolve(docs())},
      onSnapshot:function(next){var l={c:c,f:function(){next(docs())}};ecouteurs.push(l);setTimeout(l.f,0);return function(){ecouteurs=ecouteurs.filter(function(x){return x!==l})}},
      doc:function(id){return docRef(c,id||nouvelId())},
      add:function(d){var r=docRef(c,nouvelId());return r.set(d).then(function(){return r})},
      path:c
    };
  }
  var db={collection:function(c){return requete(c,null,0)},doc:function(p){var s=p.split('/');return docRef(s[0],s[1])}};
  var assets={
    upload:function(blob){var id=nouvelId();window.__demoFiles[id]=URL.createObjectURL(blob);return Promise.resolve({id:id,url:window.__demoFiles[id],contentType:blob.type,sizeBytes:blob.size})},
    delete:function(id){delete window.__demoFiles[id];return Promise.resolve({deleted:true})},
    list:function(){return Promise.resolve({assets:[],usage:{}})}
  };
  var downloads={save:function(o){
    var blob=o.data instanceof Blob?o.data:new Blob([o.data]);var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();
    return Promise.resolve({status:'saved'});
  }};
  var user={can:function(){return true},canEdit:function(){return true},isOwner:function(){return true},id:function(){return Promise.resolve('equipe')},me:function(){return Promise.resolve({id:'equipe'})},profiles:function(){return Promise.resolve({})}};
  window.__hygiene={changerCode:function(){return Promise.reject(err('invalid_argument','Désactivé dans la démo'))},sortir:function(){window.__demoReset()}};
  window.claude={use:function(n){return Promise.resolve({db:db,user:user,downloads:downloads,assets:assets}[n]||null)}};
  try{document.getElementById('login').hidden=true}catch(e){}
})();

</script>

<script>

  function $(s){return document.querySelector(s)}

  function p2(n){return String(n).padStart(2,'0')}

  function hhmm(ts){return new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
  function dshort(k){return kdate(k).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}
  function dnum(k){var d=kdate(k);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()}
  function dlong(k){return cap(kdate(k).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))}

    var s=String(str==null?'':str).trim().replace(',','.').replace(/[−–]/g,'-');

  }

    words.forEach(function(w){var t=cur?cur+' '+w:w;if(x.measureText(t).width>812&&cur){lines.push(cur);cur=w}else cur=t});

  /* ---------- Production ---------- */
  function minsSince(ts){return Math.floor((Date.now()-ts)/60000)}
  function dur(m){return m<60?m+' min':Math.floor(m/60)+' h '+p2(m%60)}
  function viewCooling(){
    var dis=S.canWrite?'':' disabled';
    var h='<section class="blk"><p class="step">Objectif : passer sous '+n(S.cfg.coolMax)+' °C à cœur en moins de '+dur(S.cfg.coolMin)+'.</p>';

    if(run.length){
      h+='<div class="cards">'+run.map(function(c){
        var m=minsSince(c.start),late=m>S.cfg.coolMin,k='c:'+c.id;
        return '<article class="eq'+(late?' is-bad':m>S.cfg.coolMin*0.75?' is-warn':'')+'"><header><h3>'+esc(c.product)+'</h3><span class="range">'+(c.tStart!=null?fmt(c.tStart)+' °C':'')+'</span></header>'+
          '<p class="meta">Démarré à '+hhmm(c.start)+' par '+esc(c.who||'')+'</p><p class="hint '+(late?'bad':'')+'">'+dur(m)+' écoulées'+(late?' : délai dépassé':' · limite à '+hhmm(c.start+S.cfg.coolMin*60000))+'</p>'+
          '<div class="field"><input class="temp" id="'+k+'t" type="text" inputmode="decimal" data-d="'+k+':t" value="'+dv(k+':t','')+'" placeholder="Temp. finale" aria-label="Température finale"'+dis+'><span class="unit">°C</span></div>'+
          '<div class="corr"><label for="'+k+'a">Action corrective (si non conforme)</label><input id="'+k+'a" type="text" data-d="'+k+':a" value="'+dv(k+':a','')+'" placeholder="Ex. produit jeté"'+dis+'></div>'+
          '<div class="row"><button class="btn primary" data-act="endCool" data-id="'+c.id+'"'+dis+'>Terminer</button><button class="btn danger'+(S.confirm==='cool:'+c.id?' sure':'')+'" data-act="delCool" data-id="'+c.id+'"'+dis+'>'+(S.confirm==='cool:'+c.id?'Confirmer':'Annuler')+'</button></div></article>';
      }).join('')+'</div>';
    }
    h+='<div class="form"><div class="grid2"><div class="f"><label for="c-prod">Produit</label><input class="in" id="c-prod" data-d="cn:prod" value="'+dv('cn:prod','')+'" placeholder="Ex. blanquette, fond de veau"'+dis+'></div>'+
      '<div class="f"><label for="c-t">Température de départ</label><div class="field"><input class="temp" id="c-t" type="text" inputmode="decimal" data-d="cn:t" value="'+dv('cn:t','')+'" placeholder="Ex. 65"'+dis+'><span class="unit">°C</span></div></div></div>'+
      '<div class="row"><button class="btn primary" data-act="startCool"'+dis+'>Démarrer le refroidissement</button></div></div></section>';

          (last?'<p class="meta">Dernier contrôle : '+dshort(dkey(new Date(last.ts)))+' · '+({ras:'RAS',filtree:'Filtrée',changee:'Changée'}[last.action]||'')+(last.polar!=null?' · '+n(last.polar)+' %':'')+'</p>':'<p class="meta">Aucun contrôle enregistré</p>')+
          '<div class="f"><label for="'+k+'p">Composés polaires (%, si testeur)</label><input class="in" id="'+k+'p" inputmode="decimal" data-d="'+k+':p" value="'+dv(k+':p','')+'"'+dis+'></div>'+
          '<div class="f"><span class="lb">Aspect</span>'+segBtns(k+':asp',{bonne:'Bon',moyenne:'Moyen',mauvaise:'Mauvais'},dget(k+':asp','bonne'))+'</div>'+
          '<div class="f"><span class="lb">Action</span>'+segBtns(k+':act',{ras:'RAS',filtree:'Filtrée',changee:'Changée'},dget(k+':act','ras'))+'</div>'+

  /* ---------- Semaine et mois ---------- */
  function viewPeriod(){
    var m=maps();
    return ['weekly','monthly'].map(function(f){
      var list=S.tasks.filter(function(t){return t.freq===f}),pk=pkey(f);
      var dn=list.filter(function(t){return m.d[pk+'_'+t.id]}).length;
      return '<section class="blk"><div class="blk-h"><h2>'+(f==='weekly'?'À la semaine':'Au mois')+'</h2><p class="sub">'+periodLabel(f)+' · '+dn+'/'+list.length+' faites</p></div>'+taskList(list,f,m.d)+'</section>';

  /* ---------- Historique ---------- */
  function coverage(){
    var days=[],i,cur={};S.equip.forEach(function(e){cur[e.id]=1});
    var daily=S.tasks.filter(function(t){return t.freq==='daily'}),dcur={};daily.forEach(function(t){dcur[t.id]=1});
    for(i=0;i<14;i++){var d=new Date();d.setDate(d.getDate()-i);days.push(d)}
    var rows=days.map(function(d){
      var k=dkey(d);
      function cell(slot){
        var rs=S.readings.filter(function(r){return r.dateKey===k&&r.slot===slot&&cur[r.equipId]});
        var c=rs.length,b=rs.some(function(r){return !r.ok}),tot=S.equip.length;
        var cls=b?'bad':(tot&&c>=tot?'full':(c?'part':'none'));
        return '<td class="c '+cls+'">'+(c||b?c+'/'+tot:'–')+'</td>';
      }
      var dd=S.done.filter(function(x){return x.periodKey==='d-'+k&&dcur[x.taskId]}).length;
      var tc=dd?(daily.length&&dd>=daily.length?'full':'part'):'none';
      var rc=S.receptions.filter(function(r){return dkey(new Date(r.ts))===k});
      var rb=rc.some(function(r){return !r.ok});
      return '<tr><td>'+cap(dshort(k))+'</td>'+cell('matin')+cell('soir')+'<td class="c '+tc+'">'+(dd?dd+'/'+daily.length:'–')+'</td><td class="c '+(rc.length?(rb?'bad':'full'):'none')+'">'+(rc.length||'–')+'</td></tr>';
    }).join('');
    return '<div class="tablewrap"><table><thead><tr><th>Jour</th><th>Matin</th><th>Soir</th><th>Tâches</th><th>Livraisons</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  function stats30(){
    var cut=Date.now()-30*86400000;
    function in30(x){return x.ts>=cut}
    var rd=S.readings.filter(in30),ok=rd.filter(function(r){return r.ok}).length;
    var rc=S.receptions.filter(in30),rcBad=rc.filter(function(r){return !r.ok}).length;
    var lj=S.labels.filter(function(l){return l.status==='jete'&&(l.closedTs||l.ts)>=cut}).length;
    var oc=S.oils.filter(function(o){return in30(o)&&o.action==='changee'}).length;
    var cb=S.cooling.filter(function(c){return in30(c)&&c.status==='termine'&&!c.ok}).length;
    var pct=rd.length?Math.round(ok/rd.length*100):null;
    return '<div class="stats">'+
      '<div class="stat'+(pct!=null&&pct<95?' is-warn':pct!=null?' is-done':'')+'"><b>'+(pct==null?'–':pct+' %')+'</b><span>Relevés conformes ('+rd.length+')</span></div>'+
      '<div class="stat'+(rcBad?' is-warn':'')+'"><b>'+rcBad+'/'+rc.length+'</b><span>Livraisons non conformes</span></div>'+
      '<div class="stat"><b>'+lj+'</b><span>Produits jetés (DLC)</span></div>'+
      '<div class="stat"><b>'+oc+'</b><span>Changements d\'huile</span></div>'+
      '<div class="stat'+(cb?' is-bad':'')+'"><b>'+cb+'</b><span>Refroidissements ratés</span></div></div>';
  }
  var HK={temp:'Températures',tasks:'Tâches',rec:'Livraisons',labels:'Étiquettes',oil:'Huiles',cool:'Refroidissement'};
  function viewHistory(){
    var cut=Date.now()-S.showDays*86400000;
    var h='<section class="blk"><div class="blk-h"><h2>30 derniers jours</h2></div>'+stats30()+'</section>';
    h+='<section class="blk"><div class="blk-h"><h2>14 derniers jours</h2><p class="sub">Relevés faits sur relevés attendus, tâches du jour et livraisons</p></div>'+coverage()+'</section>';
    h+='<section class="blk"><div class="blk-h"><h2>Détail</h2></div><div class="chips">'+Object.keys(HK).map(function(k){return '<button class="chk" data-act="hkind" data-v="'+k+'" aria-pressed="'+(S.hkind===k)+'">'+HK[k]+'</button>'}).join('')+'</div>';
    var row='',items=[],empty='Rien d\'enregistré sur cette période.';
    if(S.hkind==='temp'){
      h+='<div class="chips"><button class="chk" data-act="onlyBad" aria-pressed="'+S.onlyBad+'">Seulement les hors plage</button></div>';
      items=S.readings.filter(function(r){return r.ts>=cut&&(!S.onlyBad||!r.ok)});
      row=function(r){return '<li class="'+(r.ok?'':'bad')+'"><span class="ttl">'+esc(r.equipName)+' · '+(r.slot==='matin'?'Matin':'Soir')+' <span class="pill '+(r.ok?'ok':'bad')+'">'+(r.ok?'Conforme':'Hors plage')+'</span></span><span class="val2">'+fmt(r.value)+' °C</span>'+
        '<span class="by">'+esc(r.who||'')+' · '+hhmm(r.ts)+(r.action?' · Action : '+esc(r.action):'')+'</span></li>'};
    }else if(S.hkind==='tasks'){
      items=S.done.filter(function(d){return d.ts>=cut});
      row=function(d){return '<li><span class="ttl">'+esc(d.taskName||'')+' <span class="pill mute">'+esc(FREQ_LABEL[d.freq]||'')+'</span></span><span class="val2">'+hhmm(d.ts)+'</span><span class="by">'+esc(d.zone||'')+' · '+esc(d.who||'')+'</span></li>'};
    }else if(S.hkind==='rec'){
      items=S.receptions.filter(function(r){return r.ts>=cut});row=recRow;
    }else if(S.hkind==='labels'){
      items=S.labels.filter(function(l){return l.ts>=cut});
      row=function(l){var st=l.status==='actif'?labelState(l):l.status==='jete'?['bad','Jeté']:['mute','Consommé'];
        return '<li><span class="ttl"><b>'+esc(l.product)+'</b> <span class="pill '+st[0]+'">'+st[1]+'</span></span><span class="val2">DLC '+dnum(l.dlcKey)+'</span><span class="by">'+esc(LTYPES[l.type]?LTYPES[l.type].n:'')+' · '+esc(l.who||'')+' · '+hhmm(l.ts)+(l.lot?' · Lot '+esc(l.lot):'')+'</span></li>'};
    }else if(S.hkind==='oil'){
      items=S.oils.filter(function(o){return o.ts>=cut});
      row=function(o){return '<li class="'+(o.ok?'':'warn')+'"><span class="ttl">'+esc(o.fryerName)+' <span class="pill '+(o.action==='changee'?'ok':'mute')+'">'+({ras:'RAS',filtree:'Filtrée',changee:'Changée'}[o.action]||'')+'</span></span><span class="val2">'+(o.polar!=null?n(o.polar)+' %':'')+'</span><span class="by">Aspect '+({bonne:'bon',moyenne:'moyen',mauvaise:'mauvais'}[o.aspect]||'')+' · '+esc(o.who||'')+' · '+hhmm(o.ts)+'</span></li>'};
    }else{
      items=S.cooling.filter(function(c){return c.ts>=cut});
      row=function(c){var st=c.status==='en_cours'?['warn','En cours']:c.ok?['ok','Conforme']:['bad','Non conforme'];
        return '<li class="'+(st[0]==='ok'?'':st[0])+'"><span class="ttl"><b>'+esc(c.product)+'</b> <span class="pill '+st[0]+'">'+st[1]+'</span></span><span class="val2">'+(c.tStart!=null?fmt(c.tStart):'?')+' → '+(c.tEnd!=null?fmt(c.tEnd):'…')+' °C</span>'+
          '<span class="by">'+hhmm(c.start)+(c.end?' à '+hhmm(c.end)+' ('+dur(Math.round((c.end-c.start)/60000))+')':'')+' · '+esc(c.who||'')+(c.action?' · Action : '+esc(c.action):'')+'</span></li>'};
    }
    h+=items.length?byDayList(items,row):'<p class="empty">'+empty+'</p>';
    h+='<div class="row"><button class="btn" data-act="more">Afficher 30 jours de plus</button>'+(S.dl?'<button class="btn" data-act="export">Exporter « '+HK[S.hkind]+' » (CSV)</button>':'')+'</div><p class="sub">Les 1 000 enregistrements les plus récents de chaque registre sont chargés.</p></section>';
    return h;
  }

  async function compress(file){
    if(!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type||''))return file;
    try{
      var bmp=await createImageBitmap(file),sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
      var c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      var b=await new Promise(function(r){c.toBlob(r,'image/jpeg',0.82)});
      return b||file;
    }catch(e){return file}
  }

  function delSimple(coll,id){
    var tag=coll+':'+id;if(S.confirm!==tag){S.confirm=tag;render();return}
    S.confirm='';
    return run('d'+tag,async function(){await S.db.doc(coll+'/'+id).delete();toast('Supprimé. L\'historique est conservé.');render()});
  }
  function saveSimple(coll,id){
    return run('ss'+coll+id,async function(){
      var k='s:'+coll+':'+id,name=String(dget(k,'')).trim();
      if(!name){toast('Le nom ne peut pas être vide.');return}
      await S.db.doc(coll+'/'+id).update({name:name});delete S.drafts[k];toast('Enregistré');render();
    });
  }
  function addSimple(coll){
    return run('as'+coll,async function(){
      var name=(dget('ns:'+coll,'')||'').trim();if(!name){toast('Entre un nom.');return}
      var list=coll==='suppliers'?S.suppliers:S.fryers;
      var order=list.reduce(function(a,e){return Math.max(a,e.order||0)},0)+1;
      await S.db.collection(coll).add({name:name,order:order});delete S.drafts['ns:'+coll];toast('Ajouté');render();
    });
  }
  function saveTask(id){
    return run('st'+id,async function(){
      var t=S.tasks.filter(function(x){return x.id===id})[0],p='k:'+id+':';if(!t)return;
      var name=String(dget(p+'name',t.name)).trim();
      if(!name){toast('Donne un nom à la tâche.');return}
      await S.db.doc('tasks/'+id).update({name:name,freq:dget(p+'freq',t.freq),zone:dget(p+'zone',t.zone||'Général')});
      clearD(p);toast('Tâche mise à jour');render();
    });
  }
  function addTask(){
    return run('at',async function(){
      var name=(dget('nk:name','')||'').trim();
      if(!name){toast('Donne un nom à la tâche.');return}
      var order=S.tasks.reduce(function(a,t){return Math.max(a,t.order||0)},0)+1;
      await S.db.collection('tasks').add({name:name,freq:dget('nk:freq','daily'),zone:dget('nk:zone','Cuisine'),order:order});
      clearD('nk:');toast('Tâche ajoutée');render();
    });
  }
  function saveCfg(){
    return run('cfg',async function(){
      var c=JSON.parse(JSON.stringify(S.cfg)),bad=false;
      Object.keys(LTYPES).forEach(function(k){var v=parseNum(dget('cfg:dlc.'+k,c.dlc[k]));if(v==null||v<0)bad=true;else c.dlc[k]=Math.round(v)});
      ['recFrais','recSurg','polarMax','coolMax','coolMin'].forEach(function(k){var v=parseNum(dget('cfg:'+k,c[k]));if(v==null)bad=true;else c[k]=v});
      if(bad){toast('Une valeur n\'est pas un nombre. Vérifie les champs.');return}
      await S.db.doc('config/main').set(c);clearD('cfg:');toast('Durées et seuils enregistrés');render();
    });
  }
  function csvCell(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
  function dt(ts){return dnum(dkey(new Date(ts)))}
  async function doExport(){
    var name,head,rows,k=S.hkind;
    function asc(list){return list.slice().sort(function(a,b){return a.ts-b.ts})}
    if(k==='temp'){name='releves-temperatures';head=['Date','Heure','Moment','Équipement','Température (°C)','Plage attendue','Conforme','Action corrective','Par'];
      rows=asc(S.readings).map(function(r){return [dt(r.ts),hhmm(r.ts),r.slot==='matin'?'Matin':'Soir',r.equipName,n(r.value),n(r.min)+' à '+n(r.max)+' °C',r.ok?'Oui':'Non',r.action||'',r.who||'']})}
    else if(k==='tasks'){name='taches-hygiene';head=['Date','Heure','Fréquence','Zone','Tâche','Par'];
      rows=asc(S.done).map(function(d){return [dt(d.ts),hhmm(d.ts),FREQ_LABEL[d.freq]||d.freq,d.zone||'',d.taskName||'',d.who||'']})}
    else if(k==='rec'){name='receptions-marchandises';head=['Date','Heure','Fournisseur','Produits','Type','Température (°C)','Emballage intact','DLC correcte','Lot','DLC','Conforme','Décision','Commentaire','Photo','Par'];
      rows=asc(S.receptions).map(function(r){return [dt(r.ts),hhmm(r.ts),r.supplier,r.products||'',RTYPES[r.type]||r.type,r.temp!=null?n(r.temp):'',r.emb?'Oui':'Non',r.dlcOk?'Oui':'Non',r.lot||'',r.dlc?dnum(r.dlc):'',r.ok?'Oui':'Non',{accepte:'Acceptée',reserve:'Acceptée avec réserve',refuse:'Refusée'}[r.decision]||'',r.comment||'',r.photo?'Oui':'Non',r.who||'']})}
    else if(k==='labels'){name='etiquettes-dlc';head=['Date','Heure','Produit','Type','DLC','Lot','Statut','Par'];
      rows=asc(S.labels).map(function(l){return [dt(l.ts),hhmm(l.ts),l.product,LTYPES[l.type]?LTYPES[l.type].n:l.type,dnum(l.dlcKey),l.lot||'',{actif:'En stock',consomme:'Consommé',jete:'Jeté'}[l.status]||l.status,l.who||'']})}
    else if(k==='oil'){name='huiles-friture';head=['Date','Heure','Friteuse','Composés polaires (%)','Aspect','Action','Conforme','Par'];
      rows=asc(S.oils).map(function(o){return [dt(o.ts),hhmm(o.ts),o.fryerName,o.polar!=null?n(o.polar):'',o.aspect,{ras:'RAS',filtree:'Filtrée',changee:'Changée'}[o.action]||'',o.ok?'Oui':'Non',o.who||'']})}
    else{name='refroidissements';head=['Date','Produit','Début','Temp. début (°C)','Fin','Temp. fin (°C)','Durée (min)','Conforme','Action corrective','Par'];
      rows=asc(S.cooling).map(function(c){return [dt(c.ts),c.product,hhmm(c.start),c.tStart!=null?n(c.tStart):'',c.end?hhmm(c.end):'',c.tEnd!=null?n(c.tEnd):'',c.end?Math.round((c.end-c.start)/60000):'',c.status==='en_cours'?'En cours':c.ok?'Oui':'Non',c.action||'',c.who||'']})}
    try{
      var txt='﻿'+[head].concat(rows).map(function(r){return r.map(csvCell).join(';')}).join('\r\n');
      await S.dl.save({filename:name+'-'+dkey(new Date())+'.csv',data:txt});
    }catch(e){if(!e||e.code!=='declined')toast("Export impossible depuis cet écran.")}
  }

  /* ---------- événements ---------- */
  function go(tab){S.tab=tab;S.confirm='';S.slot=autoSlot();render();window.scrollTo(0,0)}
  $('#back').addEventListener('click',function(){go('home')});
  $('#who').value=S.who;
  $('#who').addEventListener('input',function(e){S.who=e.target.value.trim();lsSet('who',S.who)});
  var view=$('#view');
  view.addEventListener('input',function(e){
    var t=e.target,k=t.dataset.d;if(!k)return;
    S.drafts[k]=t.value;
    var c=t.closest('[data-card]');if(c)refreshCard(c);
    if(k.indexOf('r:')===0)refreshRec();
  });
  view.addEventListener('change',function(e){
    var t=e.target;
    if(t.dataset.up&&t.files&&t.files[0]){upload(t.files[0],t.dataset.up);t.value='';return}
    var k=t.dataset.d;if(!k)return;
    S.drafts[k]=t.value;
    if(k==='ne:kind'){
      var r=DEF_RANGE[t.value]||[0,4];S.drafts['ne:min']=n(r[0]);S.drafts['ne:max']=n(r[1]);render();
    }
    if(k==='r:sup'||k==='l:orig')render();
  });
  view.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
    var a=b.dataset.act,id=b.dataset.id;
    if(a!=='setd'&&a.indexOf('del')!==0&&S.confirm){S.confirm=''}
    if(a==='slot'){S.slot=b.dataset.slot;render()}
    else if(a==='goto')go(b.dataset.tab);
    else if(a==='setd'){S.drafts[b.dataset.k]=b.dataset.v;if(b.dataset.k==='r:type'){delete S.drafts['r:temp']}render()}
    else if(a==='saveTemp')saveTemp(b.dataset.eq,b.dataset.key);
    else if(a==='editTemp'){S.editing[b.dataset.key]=1;render()}
    else if(a==='cancelEdit'){var kk=b.dataset.key;delete S.editing[kk];delete S.drafts['t:'+kk];delete S.drafts['a:'+kk];render()}
    else if(a==='sign'){
      var inp=view.querySelector('[data-d="'+b.dataset.k+'"]');if(!inp)return;
      inp.value=inp.value.charAt(0)==='-'?inp.value.slice(1):'-'+inp.value;
      S.drafts[b.dataset.k]=inp.value;var c=inp.closest('[data-card]');if(c)refreshCard(c);refreshRec();inp.focus();
    }
    else if(a==='toggleTask')toggleTask(b.dataset.task);
    else if(a==='saveRec')saveRec();
    else if(a==='clearph'){delete S.drafts[b.dataset.k];delete S.drafts[b.dataset.k+'u'];render()}
    else if(a==='zoom'){var lb=$('#lightbox');lb.querySelector('img').src=b.dataset.src;lb.hidden=false}
    else if(a==='saveLabel')saveLabel();
    else if(a==='usePreset')usePreset(id);
    else if(a==='portions')setPortions(id,Number(b.dataset.v));
    else if(a==='usePortion')usePortion(id);
    else if(a==='artCat'){S.artCat=b.dataset.v;lsSet('artCat',S.artCat);render()}
    else if(a==='artEdit'){S.artEdit=!S.artEdit;S.artForm=null;render()}
    else if(a==='artOpen'){clearD('af:');S.artForm=id;render();var af=document.getElementById('af-name');if(af){af.scrollIntoView({block:'center'});if(id==='new')af.focus()}}
    else if(a==='artSave')artSave();
    else if(a==='artClose'){clearD('af:');S.artForm=null;render()}
    else if(a==='oneOff'){S.oneOff=true;render();var lp=document.getElementById('l-prod');if(lp){lp.scrollIntoView({block:'center'});lp.focus()}}
    else if(a==='oneOffClose'){S.oneOff=false;clearD('l:');render()}
    else if(a==='savePreset')savePreset(id);
    else if(a==='dlLabel')dlLabel(id);
    else if(a==='closeLabel'){S.lastLabel='';render()}
    else if(a==='showLabel'){S.lastLabel=id;render();window.scrollTo(0,0)}
    else if(a==='labelStatus')labelStatus(id,b.dataset.v);
    else if(a==='startCool')startCool();
    else if(a==='endCool')endCool(id);
    else if(a==='delCool')delCool(id);
    else if(a==='saveOil')saveOil(id);
    else if(a==='hkind'){S.hkind=b.dataset.v;render()}
    else if(a==='onlyBad'){S.onlyBad=!S.onlyBad;render()}
    else if(a==='more'){S.showDays+=30;render()}
    else if(a==='export')doExport();
    else if(a==='delDoc')delDoc(id);
    else if(a==='saveEquip')saveEquip(id);
    else if(a==='addEquip')addEquip();
    else if(a==='delSimple')delSimple(b.dataset.c,id);
    else if(a==='saveSimple')saveSimple(b.dataset.c,id);
    else if(a==='addSimple')addSimple(b.dataset.c);
    else if(a==='saveTask')saveTask(id);
    else if(a==='addTask')addTask();
    else if(a==='saveCfg')saveCfg();
    else if(a==='changeCode'){var ca=document.getElementById('code-a').value,cn=document.getElementById('code-n').value;
      if(!/^\d{4}$/.test(cn)){toast('Le nouveau code doit faire 4 chiffres.');return}
      window.__hygiene.changerCode(ca,cn).then(function(){toast('Code changé. Les autres appareils devront entrer le nouveau code.');render()},function(e){toast(e.message||'Changement impossible.')})}
    else if(a==='logout')window.__hygiene.sortir();
  });
  $('#lightbox').addEventListener('click',function(){this.hidden=true;this.querySelector('img').removeAttribute('src')});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')$('#lightbox').hidden=true});
  function tick(){
    if(!S.ready||active())return;
    if(S.day&&S.day!==dkey(new Date())){render();return}
    if((S.tab==='cooling'||S.tab==='home')&&coolRunning().length)render();
  }
  setInterval(tick,30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});

  /* ---------- démarrage ---------- */
  render();
  (async function(){
    var c=window.claude;
    if(!c||!c.use){render();return}
    var db=null,user=null,dl=null,as=null;
    try{db=await c.use('db')}catch(e){}
    try{user=await c.use('user')}catch(e){}
    try{dl=await c.use('downloads')}catch(e){}
    try{as=await c.use('assets')}catch(e){}
    S.db=db;S.dl=dl;S.assets=as;
    if(user){
      try{var w=await Promise.resolve(user.can('data.write'));S.canWrite=(w!==false)}catch(e){}
      try{S.canEdit=!!(await Promise.resolve(user.canEdit()))}catch(e){}
    }else{S.canEdit=true}
    if(!db){render();return}
    S.ready=true;
    function byOrder(a,b){return (a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name),'fr')}
    function sub(q,key,sorter){
      q.onSnapshot(function(snap){
        S[key]=snap.docs.map(function(d){var o=Object.assign({},d.data()||{});o.id=d.id;return o});
        if(sorter)S[key].sort(sorter);
        S.loaded[key]=true;schedule();
      },function(e){S.err=(e&&e.code)||'erreur';schedule()});
    }
    sub(db.collection('equipment'),'equip',byOrder);
    sub(db.collection('tasks'),'tasks',byOrder);
    sub(db.collection('suppliers'),'suppliers',byOrder);
    sub(db.collection('fryers'),'fryers',byOrder);
    sub(db.collection('presets'),'presets',byOrder);
    db.doc('config/main').onSnapshot(function(snap){
      var d=snap.exists?snap.data():{},cfg=JSON.parse(JSON.stringify(CFG_DEF));
      Object.keys(d||{}).forEach(function(k){if(k==='dlc'&&d.dlc)Object.assign(cfg.dlc,d.dlc);else cfg[k]=d[k]});
      S.cfg=cfg;S.loaded.config=true;schedule();
    },function(e){S.err=(e&&e.code)||'erreur';schedule()});
    ['readings','done','receptions','labels','oils','cooling','documents'].forEach(function(k){
      sub(db.collection(k).orderBy('ts','desc').limit(1000),k);
    });
    render();
  })();
})();
</script>

</body>
