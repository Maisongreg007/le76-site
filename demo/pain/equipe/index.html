<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pain démo">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/pain/icone-180.png?v=1">
<link rel="icon" type="image/png" href="/pain/icone-192.png?v=1">
<title>Démo · Pain · Équipe</title>
<link rel="stylesheet" href="/pain/style.css?v=2">
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 14px;background:#5a4fcf;color:#fff;font:600 13px/1.3 -apple-system,BlinkMacSystemFont,sans-serif"><span>Démo · espace équipe du pain · données fictives, paiement simulé</span><span style="display:flex;gap:6px;flex-wrap:wrap"><a href="/demo/" style="color:#fff;background:rgba(255,255,255,.18);border-radius:99px;padding:4px 11px;text-decoration:none">Accueil démo</a><a href="../" style="color:#fff;background:rgba(255,255,255,.18);border-radius:99px;padding:4px 11px;text-decoration:none">Page campeurs</a><button onclick="fetch('/demo/pain/api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:'{&quot;action&quot;:&quot;demo_reinitialiser&quot;}'}).then(()=>location.href=location.pathname)" style="color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:99px;padding:4px 11px;font:inherit;cursor:pointer">Réinitialiser</button></span></div>
<div id="toast" role="status" aria-live="polite"></div>

<section id="login" class="wrap login" hidden>
  <form class="login-card" id="loginForm">
    <img src="/pain/icone-180.png?v=1" alt="" style="width:84px;height:84px;border-radius:19px;box-shadow:0 6px 20px rgba(0,0,0,.18)">
    <h1 style="font-size:26px;margin-top:14px">Espace équipe</h1>
    <p class="mute" id="loginHelp">Précommandes de pain du camping</p>
    <input id="code" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" maxlength="8" placeholder="Code" required>
    <input id="code2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="Confirmer le code" hidden>
    <button class="btn-main" type="submit" id="loginBtn">Entrer</button>
    <p class="error" id="loginErr"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="bar">
    <div class="bar-in">
      <span class="brand">🥐 Pain · équipe</span>
      <nav class="tabs" id="tabs">
        <button data-v="day" class="on">Aujourd’hui</button>
        <button data-v="orders">Commandes</button>
        <button data-v="products">Produits</button>
        <button data-v="stats">Chiffres</button>
        <button data-v="settings">Réglages</button>
        <button data-v="log">Journal</button>
      </nav>
    </div>
  </header>
  <main class="wrap wide" id="view"></main>
</div>

<div id="sheetBack" class="sheet-back" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-head"><button class="link" id="sheetClose">Fermer</button><h2 id="sheetTitle"></h2><span style="width:56px"></span></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script src="/pain/qr.js?v=1"></script>
<script src="/pain/equipe/equipe.js?v=7"></script>
</body>
</html>
